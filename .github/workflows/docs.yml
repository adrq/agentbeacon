name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/src/assets/logo-mark-*.svg'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Copy logo assets
        run: |
          mkdir -p docs/src/assets
          cp web/src/assets/logo-mark-light.svg docs/src/assets/logo-light.svg
          cp web/src/assets/logo-mark-dark.svg docs/src/assets/logo-dark.svg
      - run: cd docs && npm ci
      - run: cd docs && DOCS_BASE=/agentbeacon/ npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
